# Configurações de empacotamento
package:
  individually: false
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.env*'
    - '!*.md'
    - '!test-*.js'
    - 'handler.js'
    - 'lib/**'
    - 'node_modules/axios/**'
    - 'node_modules/jsdom/**'

